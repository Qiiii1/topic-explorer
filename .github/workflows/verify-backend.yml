name: Verify hosted API

on:
  push:
    branches: [main, 'codex/cloudflare-server']
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/verify-backend.yml'
  workflow_dispatch:
    inputs:
      accounts_ready:
        description: 'Require the deployed email accounts and quota service'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: vars.TOPIC_API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE_URL: ${{ vars.TOPIC_API_BASE_URL }}
      EXPECT_ACCOUNTS: ${{ github.event_name == 'push' || inputs.accounts_ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check public status and GitHub Pages preflight
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base=new URL(process.env.API_BASE_URL),origin='https://qiiii1.github.io';
          assert.equal(base.protocol,'https:');
          const response=await fetch(new URL('/api/status',base),{headers:{Origin:origin},signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);
          assert.equal(response.headers.get('Access-Control-Allow-Origin'),origin);
          const status=await response.json();
          assert.equal(status.managed,true);
          assert.ok(['live','unconfigured'].includes(status.mode));
          console.log(JSON.stringify({managed:status.managed,mode:status.mode}));
          const preflight=await fetch(new URL('/api/generate',base),{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,authorization,idempotency-key'},signal:AbortSignal.timeout(20000)});
          assert.equal(preflight.status,204);
          assert.equal(preflight.headers.get('Access-Control-Allow-Origin'),origin);
          assert.match(preflight.headers.get('Access-Control-Allow-Methods'),/POST/);
          assert.match(preflight.headers.get('Access-Control-Allow-Headers'),/Content-Type/i);
          assert.equal(status.mode,'live','Cloudflare model secret/configuration is not ready');
          if(process.env.EXPECT_ACCOUNTS==='true'){
            assert.equal(status.authRequired,true);
            assert.equal(status.accountsReady,true);
            assert.match(preflight.headers.get('Access-Control-Allow-Headers'),/Authorization/i);
            assert.match(preflight.headers.get('Access-Control-Allow-Headers'),/Idempotency-Key/i);
            const config=await fetch(new URL('/api/auth/config',base),{headers:{Origin:origin},signal:AbortSignal.timeout(20000)});
            assert.equal(config.status,200);const publicConfig=await config.json();
            assert.equal(new URL(publicConfig.url).protocol,'https:');
            assert.ok(publicConfig.publishableKey.startsWith('sb_publishable_')||publicConfig.publishableKey.startsWith('eyJ'));
            assert.equal(Object.keys(publicConfig).length,2);
            const denied=await fetch(new URL('/api/generate',base),{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(20000)});
            assert.equal(denied.status,401);assert.equal((await denied.json()).code,'LOGIN_REQUIRED');
          }
          console.log('Public API and GitHub Pages CORS are ready. No model request was made.');
          JS
