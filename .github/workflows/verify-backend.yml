name: Verify hosted API

on:
  push:
    branches: [main, 'codex/cloudflare-server']
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/verify-backend.yml'
  workflow_dispatch:
    inputs:
      real_generation:
        description: 'Make one real model request using the public clock example'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: vars.TOPIC_API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE_URL: ${{ vars.TOPIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check public status and GitHub Pages preflight
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base=new URL(process.env.API_BASE_URL),origin='https://qiiii1.github.io';
          assert.equal(base.protocol,'https:');
          const response=await fetch(new URL('/api/status',base),{headers:{Origin:origin},signal:AbortSignal.timeout(20000)});
          assert.equal(response.status,200);
          assert.equal(response.headers.get('Access-Control-Allow-Origin'),origin);
          const status=await response.json();
          assert.equal(status.managed,true);
          assert.ok(['live','unconfigured'].includes(status.mode));
          console.log(JSON.stringify({managed:status.managed,mode:status.mode}));
          const preflight=await fetch(new URL('/api/generate',base),{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'},signal:AbortSignal.timeout(20000)});
          assert.equal(preflight.status,204);
          assert.equal(preflight.headers.get('Access-Control-Allow-Origin'),origin);
          assert.match(preflight.headers.get('Access-Control-Allow-Methods'),/POST/);
          assert.match(preflight.headers.get('Access-Control-Allow-Headers'),/Content-Type/i);
          assert.equal(status.mode,'live','Cloudflare model secret/configuration is not ready');
          console.log('Public API and GitHub Pages CORS are ready. No model request was made.');
          JS
      - name: Verify one real inspiration generation
        if: github.event_name == 'workflow_dispatch' && inputs.real_generation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createProject,rootOf} from './app/domain.js';
          import {inspirationInput} from './app/inspiration.js';
          const project=createProject('钟','部署验证示例');
          const input=inspirationInput(project,rootOf(project));
          const response=await fetch(new URL('/api/generate',process.env.API_BASE_URL),{method:'POST',headers:{Origin:'https://qiiii1.github.io','Content-Type':'application/json'},body:JSON.stringify(input),signal:AbortSignal.timeout(105000)});
          const result=await response.json();
          assert.equal(response.status,200,result.error||'Model generation failed');
          assert.equal(result.mode,'live');
          assert.ok(result.nodes.length>0&&result.nodes.length<=input.count);
          assert.ok(result.nodes.every(n=>n.title&&n.description&&n.meta?.core&&n.meta?.method));
          console.log(JSON.stringify({mode:result.mode,generated:result.nodes.length,stage:input.action}));
          JS
